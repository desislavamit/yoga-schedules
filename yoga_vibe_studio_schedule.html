    const STORE="yogaVibeSelectedSlots.v1";let selected;try{selected=new Set(JSON.parse(localStorage.getItem(STORE)||"[]"))}catch{selected=new Set()}let activeSelection=null;
    const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};const fmt=n=>`${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
    function maxConcurrent(items,from,to){const points=[from,to,...items.flatMap(x=>[mins(x.time),mins(x.time)+x.duration]).filter(x=>x>from&&x<to)].sort((a,b)=>a-b);let max=0;for(let i=0;i<points.length-1;i++){const probe=(points[i]+points[i+1])/2;max=Math.max(max,items.filter(x=>mins(x.time)<probe&&mins(x.time)+x.duration>probe).length)}return max}
    function renderStudio(key){const studio=studios[key],host=document.querySelector(`#panel-${key}`),table=document.createElement("table");table.className="calendar";table.innerHTML=`<thead><tr><th class="day">Час</th>${days.map(d=>`<th class="day">${d[0]}<small>${d[1]}</small></th>`).join("")}</tr></thead><tbody></tbody>`;const body=table.tBodies[0];
      for(let start=7*60;start<22*60;start+=60){const end=start+60,half=start+30,row=document.createElement("tr");row.innerHTML=`<th class="time">${fmt(start)}</th>`;days.forEach(([day,date,iso],dayIndex)=>{const td=document.createElement("td"),button=document.createElement("button"),hasDate=studio.data.some(x=>x.date===iso),items=studio.data.filter(x=>x.date===iso&&mins(x.time)<end&&mins(x.time)+x.duration>start),fullFree=studio.rooms-maxConcurrent(items,start,end),halfFree=studio.rooms-maxConcurrent(items,half,end),selectionKey=`${key}-${iso}-${fmt(start)}`;button.type="button";button.className="slot";
        let main,sub;if(dayIndex===0&&!hasDate){button.classList.add("unknown");main="Няма данни";sub="денят е минал"}else{button.classList.add(fullFree===0?"busy":fullFree===studio.rooms?"many":"free");main=fullFree===1?"1 свободна зала":fullFree?`${fullFree} свободни зали`:"Няма свободна";sub=halfFree>fullFree?`От ${fmt(half)}: ${halfFree===1?"1 свободна":`${halfFree} свободни`}`:fullFree===studio.rooms?"всички зали":"за целия час"}if(selected.has(selectionKey))button.classList.add("selected");button.setAttribute("aria-pressed",String(selected.has(selectionKey)));button.innerHTML=`<span class="main">${main}</span><span class="sub">${sub}</span>`;button.onclick=()=>showDetails(key,day,date,start,items,main,sub,selectionKey,button);td.append(button);row.append(td)});body.append(row)}host.append(table)}
    renderStudio("san");renderStudio("gar");
    document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===tab)));document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("active",x.id===`panel-${tab.dataset.tab}`))});
    const dialog=document.querySelector("#details"),toggle=document.querySelector("#select-toggle");document.querySelector(".close").onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};

    toggle.onclick=()=>{if(!activeSelection)return;const{key,button}=activeSelection;if(selected.has(key))selected.delete(key);else selected.add(key);try{localStorage.setItem(STORE,JSON.stringify([...selected]))}catch{}const on=selected.has(key);button.classList.toggle("selected",on);button.setAttribute("aria-pressed",String(on));updateToggle(on)};
    function showDetails(studioKey,day,date,start,items,main,sub,key,button){activeSelection={key,button};document.querySelector("#detail-title").textContent=`${studios[studioKey].name} · ${day} ${date} · ${fmt(start)}–${fmt(start+60)}`;document.querySelector("#detail-availability").textContent=`${main} · ${sub}`;document.querySelector("#class-list").innerHTML=items.length?items.sort((a,b)=>mins(a.time)-mins(b.time)).map(x=>`<li><strong>${x.time}–${fmt(mins(x.time)+x.duration)}</strong> · ${x.title}${x.trainer?`<br>${x.trainer}`:""}</li>`).join(""):"<li>Няма публикуван клас в този часови диапазон.</li>";updateToggle(selected.has(key));dialog.showModal()}
